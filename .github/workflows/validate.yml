name: Validate

on:
  push:
  pull_request:
  schedule:
    - cron: "0 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  hassfest:
    name: Home Assistant (hassfest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: home-assistant/actions/hassfest@master

  hacs:
    name: HACS
    runs-on: ubuntu-latest
    steps:
      - uses: hacs/action@main
        with:
          category: integration
          ignore: brands

  tests:
    name: Lint and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      # Newest harness; it ships HA 2026.10.4 until a 2026.11 build exists.
      - run: pip install pytest-homeassistant-custom-component==0.13.375 ruff
      - run: ruff check --select E,F,W,B,UP,SIM,PL,RUF --ignore PLR0913,PLR2004,PLR0912,E501,RUF012 custom_components tests
      - run: ruff format --check custom_components tests
      - run: python -m pytest -q

  card:
    name: Card bundle is up to date
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - run: npm ci
        working-directory: card
      - run: npm run build
        working-directory: card
      - name: Built card matches the source
        run: git diff --exit-code custom_components/daytime_alarm/frontend/
